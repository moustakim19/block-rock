  <g>
    <rect x="316" y="136" width="120" height="120" rx="10" fill="#0C0A12"/>
    <rect x="319" y="139" width="114" height="114" rx="8" fill="url(#g-rose)"/>
    <path d="M319 139 L433 139 L414 158 L338 158 Z" fill="#FFFFFF" opacity="0.32"/>
