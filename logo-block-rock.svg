    <path d="M204 144 L236 144 L204 176 Z" fill="#FFFFFF" opacity="0.55"/>
    <path d="M286 244 L304 244 L304 226 Z" fill="#FFFFFF" opacity="0.12"/>
    <rect x="199" y="139" width="114" height="114" rx="8" fill="none" stroke="#6CF5E6" stroke-width="2" opacity="0.7"/>
  </g>
