    <rect x="338" y="158" width="76" height="76" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <path d="M324 144 L356 144 L324 176 Z" fill="#FFFFFF" opacity="0.55"/>
    <path d="M406 244 L424 244 L424 226 Z" fill="#FFFFFF" opacity="0.12"/>
    <rect x="319" y="139" width="114" height="114" rx="8" fill="none" stroke="#FF86C6" stroke-width="2" opacity="0.7"/>
  </g>
  <!-- Bloc or -->
  <g>
    <rect x="196" y="256" width="120" height="120" rx="10" fill="#0C0A12"/>
    <rect x="199" y="259" width="114" height="114" rx="8" fill="url(#g-or)"/>
    <path d="M199 259 L313 259 L294 278 L218 278 Z" fill="#FFFFFF" opacity="0.32"/>
    <path d="M199 259 L218 278 L218 354 L199 373 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M313 259 L313 373 L294 354 L294 278 Z" fill="#000000" opacity="0.22"/>
    <path d="M199 373 L218 354 L294 354 L313 373 Z" fill="#000000" opacity="0.42"/>
    <path d="M218 278 L294 278 L272.0 300.0 L240.0 300.0 Z" fill="#FFFFFF" opacity="0.16"/>
    <path d="M294 278 L294 354 L272.0 332.0 L272.0 300.0 Z" fill="#000000" opacity="0.12"/>
    <path d="M294 354 L218 354 L240.0 332.0 L272.0 332.0 Z" fill="#000000" opacity="0.26"/>
    <path d="M218 354 L218 278 L240.0 300.0 L240.0 332.0 Z" fill="#FFFFFF" opacity="0.06"/>
    <rect x="240.0" y="300.0" width="32" height="32" fill="#FFFFFF" opacity="0.10"/>
    <path d="M218 278 L240.0 300.0 M294 278 L272.0 300.0 M294 354 L272.0 332.0 M218 354 L240.0 332.0" stroke="#FFFFFF" stroke-width="1.2" opacity="0.25" fill="none"/>
    <rect x="218" y="278" width="76" height="76" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <path d="M204 264 L236 264 L204 296 Z" fill="#FFFFFF" opacity="0.55"/>
    <path d="M286 364 L304 364 L304 346 Z" fill="#FFFFFF" opacity="0.12"/>
    <rect x="199" y="259" width="114" height="114" rx="8" fill="none" stroke="#FFD976" stroke-width="2" opacity="0.7"/>
