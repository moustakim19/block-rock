    <path d="M174 158 L174 234 L152.0 212.0 L152.0 180.0 Z" fill="#000000" opacity="0.12"/>
    <path d="M174 234 L98 234 L120.0 212.0 L152.0 212.0 Z" fill="#000000" opacity="0.26"/>
    <path d="M98 234 L98 158 L120.0 180.0 L120.0 212.0 Z" fill="#FFFFFF" opacity="0.06"/>
    <rect x="120.0" y="180.0" width="32" height="32" fill="#FFFFFF" opacity="0.10"/>
    <path d="M98 158 L120.0 180.0 M174 158 L152.0 180.0 M174 234 L152.0 212.0 M98 234 L120.0 212.0" stroke="#FFFFFF" stroke-width="1.2" opacity="0.25" fill="none"/>
    <rect x="98" y="158" width="76" height="76" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <path d="M84 144 L116 144 L84 176 Z" fill="#FFFFFF" opacity="0.55"/>
    <path d="M166 244 L184 244 L184 226 Z" fill="#FFFFFF" opacity="0.12"/>
    <rect x="79" y="139" width="114" height="114" rx="8" fill="none" stroke="#C29BFF" stroke-width="2" opacity="0.7"/>
  </g>
