<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Block Rock</title>
  <!-- Logo Block Rock : pièce en T faite de 4 blocs d'obsidienne taillés comme des gemmes -->
  <defs>
    <!-- Fond : obsidienne, du violet très sombre au noir -->
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E1734"/><stop offset="1" stop-color="#040307"/></linearGradient>
    <!-- Halo lumineux derrière la pièce -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8F5BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#8F5BFF" stop-opacity="0"/></radialGradient>
    <!-- Couleur du bloc violet : clair en haut à gauche, foncé en bas à droite -->
    <linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C29BFF"/><stop offset="1" stop-color="#4A1DA6"/></linearGradient>
    <!-- Couleur du bloc turquoise : clair en haut à gauche, foncé en bas à droite -->
    <linearGradient id="g-turquoise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6CF5E6"/><stop offset="1" stop-color="#0A7470"/></linearGradient>
    <!-- Couleur du bloc rose : clair en haut à gauche, foncé en bas à droite -->
    <linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF86C6"/><stop offset="1" stop-color="#9E1460"/></linearGradient>
    <!-- Couleur du bloc or : clair en haut à gauche, foncé en bas à droite -->
    <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD976"/><stop offset="1" stop-color="#B0600C"/></linearGradient>
  </defs>
  <!-- Fond arrondi (forme d'icône d'appli) -->
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <!-- Reflets d'obsidienne dans le fond -->
  <path d="M0 140 L170 0 L250 0 L0 220 Z" fill="#FFFFFF" opacity="0.03"/>
  <path d="M512 330 L330 512 L270 512 L512 270 Z" fill="#FFFFFF" opacity="0.025"/>
  <circle cx="256" cy="250" r="230" fill="url(#halo)"/>
  <!-- Ombre lumineuse sous la pièce -->
  <ellipse cx="256" cy="402" rx="120" ry="14" fill="#8F5BFF" opacity="0.25"/>
  <!-- Bloc violet -->
  <g>
    <rect x="76" y="136" width="120" height="120" rx="10" fill="#0C0A12"/>
    <rect x="79" y="139" width="114" height="114" rx="8" fill="url(#g-violet)"/>
    <path d="M79 139 L193 139 L174 158 L98 158 Z" fill="#FFFFFF" opacity="0.32"/>
    <path d="M79 139 L98 158 L98 234 L79 253 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M193 139 L193 253 L174 234 L174 158 Z" fill="#000000" opacity="0.22"/>
    <path d="M79 253 L98 234 L174 234 L193 253 Z" fill="#000000" opacity="0.42"/>
